
# sudo sysctl -w vm.max_map_count=262144
version: "3.8"
services:
  # Orion es el motor principal, el agente, el context broker
  orion:
    image: mi-keyrock-estetico
    hostname: orion-ages
    container_name: orion-ages
    depends_on:
      - mongo-db
    networks:
        default:
            ipv4_address: 172.18.1.2
    expose:
      - "1026"
    ports:
      - "1026:1026" # localhost:1026
    command: -dbhost mongo-db -logLevel DEBUG
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:1026/version || exit 1"]
      interval: 10m0s
      timeout: 30s
      retries: 5
      start_period: 30s

  #Quantum Leap
  quantumleap:
    image: orchestracities/quantumleap
    hostname: quantumleap-ages
    container_name: quantumleap-ages
    ports:
      - "8668:8668"
    depends_on:
      - crate-db
      #- redis-db
    environment:
      - CRATE_HOST=crate-db
      - LOGLEVEL=DEBUG
    networks:
        default:
            ipv4_address: 172.18.1.3


  # Bases de datos
  mongo-db:
    image: mongo:3.6
    hostname: mongo-db-ages
    container_name: db-mongo-ages
    expose:
      - "27017"
    ports:
      - "27017:27017"
    networks:
      default:
            ipv4_address: 172.18.1.4
    volumes:
      - mongo-db:/data/db
  

  crate-db:
    image: crate
    hostname: crate-db-ages
    container_name: db-crate-ages
    ports:
      - "4200:4200"
      - "4300:4300"
      - "5432:5432"
    command: crate -Cauth.host_based.enabled=false  -Ccluster.name=democluster -Chttp.cors.enabled=true -Chttp.cors.allow-origin="*"
    environment:
      - CRATE_HEAP_SIZE=4g
    volumes:
      - crate-db:/data
    networks:
        default:
            ipv4_address: 172.18.1.8

  # visualizacion
  grafana:
    image: grafana/grafana
    container_name: grafana-ages
    depends_on:
      - crate-db
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
    networks:
      default:
          ipv4_address: 172.18.1.9
  
  #IDM
  keyrock:
    image: fiware/idm:8.3.3
    container_name: fiware-keyrock
    hostname: keyrock
    networks:
        default:
            ipv4_address: 172.18.1.5
    depends_on:
        - mysql-db
    ports:
        - '7000:3000'
        - '443:443'
    environment:
        - DEBUG=idm:*
        - IDM_DB_HOST=mysql-db
        - IDM_HOST=http://keyrock:3000
        - IDM_PORT=3000
        # Development use only
        # Use Docker Secrets for Sensitive Data
        - IDM_DB_PASS=secret
        - IDM_DB_USER=root
        - IDM_ADMIN_USER=admin
        - IDM_ADMIN_EMAIL=admin@test.com
        - IDM_ADMIN_PASS=1234

  mysql-db:
    restart: always
    image: mysql:5.7
    hostname: mysql-db
    container_name: db-mysql
    expose:
        - '3306'
    ports:
        - '3306:3306'
    networks:
        default:
            ipv4_address: 172.18.1.6
    environment:
        # Development use only
        # Use Docker Secrets for Sensitive Data
        - 'MYSQL_ROOT_PASSWORD=secret'
        - 'MYSQL_ROOT_HOST=172.18.1.5'
    volumes:
        - mysql-db:/var/lib/mysql

  # Wilma PEP Proxy (protecting Orion)
  wilma:
    image: fiware/pep-proxy:8.3.0
    container_name: pep-wilma
    hostname: pep-wilma
    depends_on:
      - orion
      - keyrock
    ports:
      - "1027:1027"
    environment:
      - PEP_PROXY_PORT=1027
      - PEP_PROXY_IDM_HOST=172.18.1.5
      - PEP_PROXY_IDM_PORT=3000
      - PEP_PROXY_APP_HOST=172.18.1.2
      - PEP_PROXY_APP_PORT=1026
      - PEP_PROXY_AUTH_ENABLED=true
      - PEP_PROXY_HTTPS_ENABLED=false
      - PEP_PROXY_IDM_SSL_ENABLED=false
      - PEP_PROXY_USERNAME=pep@test.com
      - PEP_PROXY_PASSWORD=12345
      - PEP_PROXY_DEBUG=true
      - PEP_PROXY_APP_ID=ff5730d2-2f9a-4d47-8f53-46a10d1132b0
      - PEP_PROXY_PUBLIC_PATHS=/version
      - DEBUG=*
    networks:
      default:
        ipv4_address: 172.18.1.7

networks:
  default:
    ipam:
        config:
            - subnet: 172.18.1.0/24

volumes:
  mongo-db: ~
  crate-db: ~
  grafana: ~
  mysql-db: ~
